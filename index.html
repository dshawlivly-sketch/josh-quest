<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Square &amp; Cube Quest — Josh Allen's Gridiron Math Adventure</title>
<meta name="theme-color" content="#0b1450">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Quest">
<meta name="description" content="A 16-bit style adventure quiz where Coach Josh Allen teaches perfect squares and cubes from 1 to 25.">
<style>
/* Font: "Press Start 2P" by CodeMan38 — SIL Open Font License 1.1 */
@font-face{font-family:'PS2P';src:url('PressStart2P.ttf') format('truetype');font-display:swap}
:root{--gold:#ffd23f;--blue:#1c3fb8;--navy:#0b1450;--red:#d9232d;--ink:#f4f6ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04040c;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%;font-family:'PS2P','Courier New',monospace;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 40%,#12123a 0,#04040c 70%)}
button{font:inherit;color:inherit;cursor:pointer}
canvas,img,.spr,.enemy,.px{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}

#stage{position:absolute;left:0;top:0;width:640px;height:480px;transform-origin:0 0;overflow:hidden;background:#000}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.bg{position:absolute;left:0;top:0;width:640px}
y{color:var(--gold)} r{color:#ff6b6b} c{color:#7de9ff} g{color:#7dff9a} m{color:#ffa6e8}
.sym{font-family:'Segoe UI Symbol','DejaVu Sans',Arial,sans-serif;font-weight:700}

/* ---------- SNES blue window ---------- */
.win{position:absolute;background:linear-gradient(180deg,#2845d0 0%,#12207e 55%,#0a1058 100%);border:4px solid #f4f6ff;border-radius:8px;
  box-shadow:0 0 0 2px #070722,inset 0 0 0 2px #7f93ff,4px 6px 0 rgba(0,0,0,.35);padding:10px 12px;font-size:12px;line-height:1.45}
.btn{position:relative;background:rgba(7,12,70,.9);border:2px solid #7f93ff;border-radius:4px;padding:8px 10px;text-align:left;font-size:12px;line-height:1.2}
.btn:hover:not([disabled]),.btn.sel{border-color:var(--gold);color:var(--gold)}
.btn.sel::before{content:'';position:absolute;left:-17px;top:50%;margin-top:-7px;border-style:solid;border-width:7px 0 7px 11px;
  border-color:transparent transparent transparent var(--gold);animation:cur .5s steps(2) infinite}
.btn[disabled],.btn.off{opacity:.35;cursor:not-allowed}
.btn.gold{background:linear-gradient(#ffe27a,#f0a81e);color:#3a2400;border-color:#fff3b0;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.btn.gold.sel,.btn.gold:hover{color:#000}
@keyframes cur{50%{transform:translateX(3px)}}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1s steps(2) infinite}

/* ---------- title ---------- */
#title-hero{position:absolute;left:14px;bottom:0;height:452px;filter:drop-shadow(6px 0 0 rgba(0,0,0,.25));animation:breathe 1.6s steps(2) infinite}
@keyframes breathe{50%{transform:translateY(-3px)}}
#logo{position:absolute;left:210px;top:40px;width:420px;text-align:center}
#logo .l1{font-size:25px;color:#fff;letter-spacing:1px;text-shadow:2px 2px 0 var(--blue),4px 4px 0 var(--blue),5px 5px 0 var(--navy),6px 6px 0 #000}
#logo .l2{font-size:60px;margin-top:8px;color:var(--gold);letter-spacing:3px;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,3px 3px 0 var(--red),5px 5px 0 var(--red),7px 7px 0 #5a0a10,9px 9px 0 #000}
#logo .l3{margin-top:18px;font-size:11px;color:#fff;background:rgba(10,16,88,.85);display:inline-block;padding:6px 10px;border:2px solid var(--gold);border-radius:3px;letter-spacing:.5px}
#title-menu{position:absolute;left:316px;top:236px;width:250px;display:flex;flex-direction:column;gap:9px}
#title-menu .btn{font-size:13px;padding:10px 12px}
#title-runner{position:absolute;inset:0;pointer-events:none}
.fine{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:10px;color:#cfd6ff;opacity:.85;text-shadow:1px 1px 0 #000}
.pressline{position:absolute;left:210px;width:420px;top:196px;text-align:center;font-size:12px;color:#fff;text-shadow:2px 2px 0 #000}

/* ---------- map ---------- */
.hud{position:absolute;left:0;right:0;top:0;height:26px;background:rgba(7,12,70,.88);border-bottom:3px solid #f4f6ff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}
#map-nodes,#map-actors{position:absolute;inset:0}
.node{position:absolute;width:0;height:0;background:none;border:0;padding:0}
.node::after{content:'';position:absolute;left:-32px;top:-42px;width:64px;height:66px}
.node .pad{position:absolute;left:-19px;top:-6px;width:38px;height:16px;border-radius:50%;background:radial-gradient(#ffe27a,#f0a81e);border:3px solid #7a4a00;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.node.locked .pad{background:radial-gradient(#9aa0b8,#5a6078);border-color:#2b2f45}
.node.done .pad{background:radial-gradient(#9affb0,#2fb552);border-color:#0e5a24}
.node .num{position:absolute;left:14px;top:-34px;width:22px;height:22px;background:#d9232d;border:2px solid #fff;color:#fff;font-size:11px;line-height:18px;text-align:center;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.node.locked .num{background:#555a70}
.node.sel .num{background:var(--gold);color:#000;animation:hop .5s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.node .stars{position:absolute;left:-26px;top:12px;width:52px;white-space:nowrap;text-align:center}
.node .lock{position:absolute;left:-7px;top:-14px;width:14px;height:12px;background:#c9ccd8;border:2px solid #20233a;border-radius:2px}
.node .lock::before{content:'';position:absolute;left:1px;top:-8px;width:6px;height:7px;border:2px solid #c9ccd8;border-bottom:0;border-radius:4px 4px 0 0}
.star{display:inline-block;vertical-align:middle;image-rendering:auto;margin-right:2px}
#map-info{left:8px;right:8px;bottom:8px;height:88px;display:flex;align-items:center;gap:12px}
#map-info .t{font-size:14px;color:var(--gold)}
#map-info .s{font-size:11px;margin-top:7px;color:#cfe;line-height:1.3}
#map-info .grow{flex:1}
#map-info .row{display:flex;gap:10px;padding-left:16px}
#map-nav{position:absolute;left:8px;top:34px;display:flex;flex-direction:column;gap:6px}
#map-nav .btn{font-size:11px;padding:6px 8px;text-align:center}

/* ---------- sprites ---------- */
.actor{position:absolute;left:0;top:0;width:0;height:0}
.actor .spr{position:absolute;left:0;bottom:0;transform:translateX(-50%) scaleX(var(--fx,1)) rotate(var(--rot,0deg));transform-origin:50% 100%;background-repeat:no-repeat}
.actor.hurt .spr{animation:hurt .4s steps(2) 2}
@keyframes hurt{0%{filter:brightness(2.2) sepia(1) hue-rotate(-40deg) saturate(6)}50%{filter:none}}
.shadow{position:absolute;width:70px;height:12px;margin-left:-35px;margin-top:-6px;border-radius:50%;background:rgba(0,0,0,.35)}
.enemy{position:absolute;transform-origin:50% 100%}
.enemy .e{display:block;position:absolute;left:0;bottom:0}
.enemy .e.b{display:none}
.enemy.open .e.a{display:none}.enemy.open .e.b{display:block}
.enemy .bob{animation:ebob 1s steps(2) infinite}
@keyframes ebob{50%{transform:translateY(-5px)}}
.enemy.spawn{animation:spawn .6s steps(6) both}
@keyframes spawn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.enemy.hit .bob{animation:ehit .5s steps(2) 1}
@keyframes ehit{0%,50%{filter:brightness(3) saturate(0);transform:translateX(10px)}25%,75%{filter:none;transform:translateX(-8px)}100%{filter:none}}
.enemy.die{animation:die .9s steps(9) both}
@keyframes die{0%{filter:brightness(3)}30%{filter:none;transform:scale(1.1)}100%{transform:scale(0) rotate(40deg);opacity:0}}
.ball{position:absolute;left:0;top:0;transform-origin:50% 50%;z-index:4}
.pop{position:absolute;z-index:30;font-size:16px;color:var(--gold);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;animation:rise 1s steps(10) forwards;white-space:nowrap}
.pop.bad{color:#ff6b6b}.pop.big{font-size:22px}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}

/* ---------- lesson ---------- */
.board{left:214px;top:34px;width:418px;height:272px;padding:8px 12px 8px}
.vt{position:absolute;left:6px;top:5px;font-size:11px;color:var(--gold);text-shadow:1px 1px 0 #000;z-index:2;pointer-events:none}
.board .bt{font-size:11px;color:var(--gold);text-align:center;margin-bottom:6px;height:14px}
.vis{position:relative;width:384px;height:200px;margin:0 auto;background:#050a3a;border:2px solid #4a5fe0;overflow:hidden}
.vis canvas{position:absolute;left:0;top:0;width:384px;height:200px}
.vhtml{position:absolute;inset:0;padding:20px 10px 6px;font-size:11px;line-height:1.5;overflow:hidden}
.vcap{margin-top:7px;text-align:center;font-size:11px;line-height:1.55;min-height:36px}
.nbtn{position:absolute;bottom:8px;width:30px;height:24px;padding:0;text-align:center;font-size:14px;line-height:1}
.dlg{left:8px;right:8px;bottom:8px;height:162px}
.dlg .face{position:absolute;left:12px;top:12px;width:84px;height:88px;border:3px solid #f4f6ff;outline:2px solid #070722;background:#000;overflow:hidden}
.dlg .face img{width:100%;height:100%;object-fit:cover;display:block}
.dlg .face.talk img{animation:talk .3s steps(2) infinite}
@keyframes talk{50%{transform:translateY(-2px)}}
.dlg .txt{position:absolute;left:112px;right:12px;top:12px;font-size:12px;line-height:1.5}
.dlg .nav{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg .nav .btn{font-size:11px;padding:7px 9px}
.arrow{display:inline-block;color:var(--gold);animation:blink .7s steps(2) infinite}
.tbl{border-collapse:collapse;width:100%;font-size:11px}
.tbl td,.tbl th{padding:2px 4px;text-align:center;border:1px solid #3548c0}
.tbl th{color:var(--gold)}
.cells{display:grid;gap:3px 6px;font-size:11px}
.cells div{background:rgba(40,69,208,.45);border:1px solid #4a5fe0;padding:3px 5px;border-radius:3px}
.big{font-size:20px;color:var(--gold);text-align:center;margin:6px 0 8px}
.steps div{margin:5px 0}

/* ---------- battle ---------- */
#bat-hud{position:absolute;left:0;right:0;top:0;height:26px;background:rgba(7,12,70,.88);border-bottom:3px solid #f4f6ff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 10px;font-size:11px;z-index:6}
#bat-hud .hl{display:flex;gap:10px;white-space:nowrap}
#bat-hud .hr{white-space:nowrap;display:flex;gap:10px;align-items:center;margin-right:196px}
.heart{height:14px;image-rendering:pixelated}
.heart.lost{filter:grayscale(1) brightness(.5);opacity:.5}
#b-enemybar{position:absolute;right:46px;top:36px;width:190px;font-size:11px;text-align:center;z-index:5}
#b-enemybar .bar{margin-top:4px;height:12px;background:#240a0a;border:2px solid #fff;border-radius:2px;overflow:hidden}
#b-enemybar .bar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#ff4a4a 0 6px,#d92323 6px 8px);transition:width .6s steps(6)}
#bat-win{left:8px;right:8px;bottom:8px;height:216px;padding:0}
#bat-win .face{position:absolute;left:12px;top:12px;width:92px;height:96px;border:3px solid #f4f6ff;outline:2px solid #070722;background:#000;overflow:hidden}
#bat-win .face img{width:100%;height:100%;object-fit:cover;display:block}
#bat-win .face.talk img{animation:talk .3s steps(2) infinite}
#bat-win .cmds{position:absolute;left:12px;top:112px;width:96px;display:flex;flex-direction:column;gap:6px}
#bat-win .cmds .btn{font-size:11px;padding:7px 2px;text-align:center;line-height:1.25}
#b-text{position:absolute;left:122px;right:12px;top:12px;height:98px;font-size:12px;line-height:1.5;overflow:hidden}
#b-text.full{height:192px}
#b-text .q{font-size:24px;text-align:center;margin-top:8px;color:var(--gold);text-shadow:2px 2px 0 #000}
#b-text .qs{font-size:11px;text-align:center;margin-top:8px;color:#cfe}
#b-text .qlong{font-size:13px;text-align:center;margin-top:6px;line-height:1.5}
#b-ans{position:absolute;left:134px;right:12px;top:116px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
#b-ans .btn{height:38px;display:flex;align-items:center;gap:8px;font-size:15px;padding:4px 8px}
#b-ans .btn .k{flex:none;width:18px;height:18px;line-height:18px;text-align:center;background:var(--red);color:#fff;font-size:11px;font-style:normal;border-radius:3px}
#b-ans .btn.word{font-size:12px}
#b-ans .btn.good{background:#0f7a2a;border-color:#9affb0;color:#fff}
#b-ans .btn.bad{background:#7a0f18;border-color:#ff8a8a;color:#fff}
#b-ans .btn.sel.good::before,#b-ans .btn.sel.bad::before{display:none}
.stat{display:flex;justify-content:space-between;font-size:11px;margin:6px 0}
.res{text-align:center}
.res .big2{font-size:22px;color:var(--gold);text-shadow:2px 2px 0 #000;margin:4px 0 6px}
.res .starrow{display:flex;justify-content:center;gap:4px;margin:4px 0}
.res .btns{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:16px;padding-left:14px}
.res .btns .btn{font-size:11px;padding:8px 9px;text-align:center}

/* ---------- playbook ---------- */
#bk-grid{position:absolute;left:12px;top:66px;width:300px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
#bk-grid .btn{padding:4px 0;text-align:center;font-size:11px}
#bk-grid .btn small{display:block;font-size:11px;margin-top:3px;color:#9fb0ff}
#bk-grid .btn.sel::before{display:none}
#bk-grid .btn.sel{background:#2845d0}
#bk-grid .btn.sel small,#bk-grid .btn:hover small{color:var(--gold)}
#bk-tabs{position:absolute;left:12px;top:32px;display:flex;gap:10px;padding-left:16px}
#bk-tabs .btn{font-size:11px;padding:7px 10px}
#bk-board{left:326px;top:34px;width:306px;height:222px;padding:8px}
#bk-board .vis{width:288px;height:150px}
#bk-board .vis canvas{width:288px;height:150px}
#bk-board .vcap{font-size:11px}
#bk-win{left:8px;right:8px;bottom:8px;height:188px}
#bk-win .face{position:absolute;left:12px;top:12px;width:84px;height:88px;border:3px solid #f4f6ff;outline:2px solid #070722;background:#000;overflow:hidden}
#bk-win .face img{width:100%;height:100%;object-fit:cover}
#bk-win .txt{position:absolute;left:112px;right:12px;top:12px;font-size:12px;line-height:1.6}
#bk-back{position:absolute;right:12px;bottom:12px}

/* ---------- global overlays ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .28s steps(5)}
#fade.on{opacity:1;pointer-events:auto}
#flash{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0}
#flash.go{animation:flash .35s steps(4)}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
#world.shake{animation:shake .35s steps(7)}
@keyframes shake{0%{transform:translate(0,0)}15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,-2px)}60%{transform:translate(5px,3px)}80%{transform:translate(-3px,1px)}100%{transform:translate(0,0)}}
.crt{position:absolute;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45) 100%)}
#stage.nocrt .crt{display:none}
#snd{position:absolute;right:6px;top:4px;z-index:61;font-size:11px;padding:4px 6px;background:rgba(7,12,70,.9);border:2px solid #7f93ff;border-radius:3px;color:#fff}
#snd:hover{border-color:var(--gold);color:var(--gold)}
#crtbtn{right:60px}
#rotate{display:none;position:fixed;left:0;right:0;top:8px;text-align:center;font-size:11px;line-height:1.6;color:#ffd23f;z-index:5}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}
@media (prefers-reduced-motion:reduce){#world.shake{animation:none}.enemy .bob,#title-hero{animation:none}}
</style>
</head>
<body>
<div id="rotate">TURN YOUR DEVICE SIDEWAYS<br>FOR A BIGGER GAME</div>
<div id="stage">
  <div id="world">

    <!-- TITLE -->
    <section class="scene" id="sc-title">
      <canvas class="bg" id="title-bg" width="160" height="120" style="height:480px"></canvas>
      <img id="title-hero" src="sprites/hero.png" alt="Pixel art Josh Allen in a white number 17 jersey">
      <div id="logo"><div class="l1">SQUARE &amp; CUBE</div><div class="l2">QUEST</div><div class="l3">JOSH ALLEN'S GRIDIRON MATH ADVENTURE</div></div>
      <div class="pressline blink" id="title-press">PRESS START</div>
      <div id="title-menu"></div>
      <div id="title-runner"></div>
      <div class="fine">Fan-made learning game. Not affiliated with the NFL, the Buffalo Bills or Josh Allen.</div>
    </section>

    <!-- MAP -->
    <section class="scene" id="sc-map">
      <canvas class="bg" id="map-bg" width="160" height="120" style="height:480px"></canvas>
      <div id="map-nodes"></div>
      <div id="map-actors"></div>
      <div class="hud"><span>WORLD MAP</span><span id="map-total" style="margin-right:200px"></span></div>
      <div id="map-nav"></div>
      <div class="win" id="map-info"></div>
    </section>

    <!-- LESSON -->
    <section class="scene" id="sc-lesson">
      <canvas class="bg" id="les-bg" width="160" height="120" style="height:480px"></canvas>
      <div id="les-actors"></div>
      <div class="win board">
        <div class="vis" id="les-vis"></div>
        <div class="vcap" id="les-cap"></div>
      </div>
      <div class="win dlg" id="les-dlg">
        <div class="face talk" id="les-face"><img src="sprites/face.png" alt="Coach Allen"></div>
        <div class="txt" id="les-text"></div>
        <div class="nav" id="les-nav"></div>
      </div>
    </section>

    <!-- BATTLE -->
    <section class="scene" id="sc-battle">
      <canvas class="bg" id="bat-bg" width="160" height="63" style="height:252px"></canvas>
      <div id="bat-layer" style="position:absolute;inset:0"></div>
      <div id="bat-hud">
        <div class="hl"><span id="b-stage"></span><span id="b-score"></span><span id="b-streak"></span></div>
        <div class="hr"><span id="b-lives"></span></div>
      </div>
      <div id="b-enemybar"><div id="b-ename"></div><div class="bar"><i id="b-hp"></i></div></div>
      <div class="win" id="bat-win">
        <div class="face" id="b-face"><img src="sprites/face.png" alt="Coach Allen"></div>
        <div class="cmds"><button class="btn" id="b-audible"></button><button class="btn" id="b-quit">QUIT</button></div>
        <div id="b-text"></div>
        <div id="b-ans"></div>
      </div>
    </section>

    <!-- PLAYBOOK -->
    <section class="scene" id="sc-book">
      <canvas class="bg" id="bk-bg" width="160" height="120" style="height:480px"></canvas>
      <div class="hud"><span>JOSH'S PLAYBOOK</span><span style="margin-right:200px">STUDY ANY NUMBER</span></div>
      <div id="bk-tabs"></div>
      <div id="bk-grid"></div>
      <div class="win" id="bk-board"><div class="vis" id="bk-vis"></div><div class="vcap" id="bk-cap"></div></div>
      <div class="win" id="bk-win"><div class="face talk"><img src="sprites/face.png" alt="Coach Allen"></div><div class="txt" id="bk-text"></div><button class="btn" id="bk-back">BACK [ESC]</button></div>
    </section>

    <canvas id="fx" width="640" height="480"></canvas>
  </div>
  <div id="flash"></div>
  <div id="fade"></div>
  <button id="crtbtn" class="btn" style="position:absolute;top:4px;z-index:61;font-size:11px;padding:4px 6px;right:114px">CRT</button>
  <button id="snd">SND</button>
  <div class="crt"></div>
</div>
<script src="game.js"></script>
</body>
</html>
